<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CEDAR Embeddable Term Picker</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      /* This page stands in for a host. The shared roles resolve here from the token package's
         custom-properties.css, which the development build links. The body's margin and padding
         together keep the 32px gutter at which the picker's visual baselines are recorded. */
      body {
        margin: var(--cedar-space-2);
        padding: var(--cedar-space-6);
        font-family: var(--cedar-font-family);
        background: var(--cedar-surface-subtle);
      }
      h1 {
        margin: 0 0 var(--cedar-space-4);
        font-size: var(--cedar-font-size-heading);
        font-weight: var(--cedar-font-weight-medium);
        line-height: var(--cedar-line-height-heading);
      }
    </style>
  </head>
  <body>
    <!--
      A development host, standing in for the Template Designer. It exists to exercise the
      custom element the way a host page does: set an attribute, listen for an event. It is
      not part of what the bundle publishes.
    -->
    <h1>Development host</h1>
    <cedar-embeddable-term-picker query="disease" selection-mode="constraints"></cedar-embeddable-term-picker>
    <script>
      const picker = document.querySelector('cedar-embeddable-term-picker');
      picker.setAttribute('selection-mode', new URLSearchParams(location.search).get('mode') || 'constraints');
      picker.addEventListener('constraintsSelected', (event) => console.log('Applied field constraints', event.detail));
      picker.addEventListener('cancelled', () => {
        console.log('the picker was closed without a choice');
      });
    </script>
  </body>
</html>
